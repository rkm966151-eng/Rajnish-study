<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Open Book Base -->
  <path d="M120 350 C180 325 230 335 256 355 C282 335 332 325 392 350 L392 240 C332 215 282 225 256 245 C230 225 180 215 120 240 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M256 245 L256 355" stroke="#0B192C" stroke-width="5" stroke-linecap="round"/>

  <!-- Knowledge Flame / Rising Torch / Sun -->
  <path d="M256 120 C230 160 210 190 225 220 C235 195 245 180 256 160 C267 180 277 195 287 220 C302 190 282 160 256 120 Z" fill="url(#saffronGrad)"/>
  <circle cx="256" cy="180" r="14" fill="url(#goldGrad)"/>

  <!-- Graduation Cap Trim -->
  <polygon points="256,90 340,130 256,170 172,130" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M256 170 L256 195 C256 215 310 215 310 195 L310 170" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M330 135 L345 180" stroke="#FF9800" stroke-width="4" stroke-linecap="round"/>
  <circle cx="345" cy="184" r="5" fill="#E65100"/>
</svg>
